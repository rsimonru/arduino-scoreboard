<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Marcador</title>
    <script src="/libs/socket.io.min.js"></script>
    <script src="/libs/NoSleep.min.js"></script>
    <script src="/libs/lucide.min.js"></script>
    <script src="/libs/sweetalert2.all.min.js"></script>
    <link rel="stylesheet" href="tailwind.css">
</head>
<body class="touch-manipulation bg-slate-100 p-5 font-sans text-center text-slate-900">
    <main class="mx-auto max-w-4xl">
      <style>
        #noSleepToggle { display: inline-flex; align-items: center; gap: 8px; margin-left: 12px; vertical-align: middle; cursor: pointer; font-size: 1.1rem; }
        #noSleepToggle input { position: absolute; opacity: 0; width: 0; height: 0; }
        #noSleepToggle .track { position: relative; width: 52px; height: 28px; border-radius: 14px; background: #94a3b8; transition: background .2s; }
        #noSleepToggle .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
        #noSleepToggle input:checked + .track { background: #16a34a; }
        #noSleepToggle input:checked + .track::after { transform: translateX(24px); }
        #noSleepToggle input:focus-visible + .track { outline: 2px solid #3b82f6; outline-offset: 2px; }
      </style>
      <div class="mb-5">
        <button id="btnToggleSettings" type="button" aria-expanded="false" aria-controls="settingsPanel" class="cursor-pointer rounded-lg bg-slate-700 px-5 py-3 text-xl text-white transition-opacity active:opacity-80"><i data-lucide="settings" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i> Conf.</button>
        <label id="noSleepToggle" title="Mantener la pantalla encendida">
          <input id="noSleepSwitch" type="checkbox" role="switch">
          <span class="track"></span>
          <span>Pantalla activa</span>
        </label>
      </div>
      <div id="settingsPanel" class="hidden">
        <div class="mb-5 rounded-xl bg-white p-5 shadow-md">
            <h2 class="mb-4 text-2xl font-bold">Configuración Deportiva</h2>
            <select id="configSelector" class="mb-4 w-full rounded-md border border-slate-300 p-2.5 text-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" onchange="changeSport()">
                <option value="">Cargando configuraciones...</option>
            </select>
        </div>
        <div class="mb-5 rounded-xl bg-white p-5 shadow-md">
            <h2 class="mb-4 text-2xl font-bold">Equipos</h2>
            <div class="mb-4 flex flex-col items-stretch justify-center gap-2.5 md:flex-row md:items-center">
                <div class="flex w-full min-w-0 items-center gap-2 md:flex-1">
                    <img id="previewLocalLogo" alt="" class="hidden h-14 w-14 shrink-0 object-contain">
                    <div class="relative w-full min-w-0">
                        <input type="text" id="comboLocalInput" autocomplete="off" class="w-full min-w-0 rounded-xl border border-slate-300 p-2.5 text-2xl focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" onfocus="comboOpen('local')" oninput="comboRender('local')" onblur="comboClose('local')">
                        <ul id="comboLocalList" class="absolute left-0 right-0 z-20 mt-1 hidden max-h-60 overflow-y-auto rounded-xl border border-slate-300 bg-white text-left shadow-lg" onpointerdown="event.preventDefault()"></ul>
                    </div>
                </div>
                <span class="text-2xl">VS</span>
                <div class="flex w-full min-w-0 items-center gap-2 md:flex-1">
                    <img id="previewVisitorLogo" alt="" class="hidden h-14 w-14 shrink-0 object-contain">
                    <div class="relative w-full min-w-0">
                        <input type="text" id="comboVisitorInput" autocomplete="off" class="w-full min-w-0 rounded-xl border border-slate-300 p-2.5 text-2xl focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" onfocus="comboOpen('visitor')" oninput="comboRender('visitor')" onblur="comboClose('visitor')">
                        <ul id="comboVisitorList" class="absolute left-0 right-0 z-20 mt-1 hidden max-h-60 overflow-y-auto rounded-xl border border-slate-300 bg-white text-left shadow-lg" onpointerdown="event.preventDefault()"></ul>
                    </div>
                </div>
            </div>

            <h3 class="mb-2 text-xl font-bold" id="teamFormTitle">Añadir equipo</h3>
            <div class="mb-4 flex flex-col gap-2.5 rounded-xl border border-slate-300 p-3">
                <input type="text" id="teamName" placeholder="Nombre del equipo" class="w-full min-w-0 rounded-xl border border-slate-300 p-2.5 text-2xl focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                <div class="flex items-center gap-2">
                    <img id="teamFormLogo" alt="" class="hidden h-14 w-14 shrink-0 object-contain">
                    <input type="file" id="teamFile" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" class="w-full min-w-0 rounded-xl border border-slate-300 p-2 text-base">
                </div>
                <label id="teamRemoveLogoRow" class="hidden items-center justify-center gap-2 text-base"><input type="checkbox" id="teamRemoveLogo"> Quitar escudo</label>
                <div class="flex justify-center gap-2.5">
                    <button type="button" onclick="saveTeam()" class="cursor-pointer rounded-lg bg-green-600 px-4 py-2 text-xl text-white transition-opacity active:opacity-80" id="btnSaveTeam">Guardar equipo</button>
                    <button type="button" id="btnCancelTeam" onclick="resetTeamForm()" class="hidden cursor-pointer rounded-lg bg-slate-500 px-4 py-2 text-xl text-white transition-opacity active:opacity-80">Cancelar</button>
                </div>
            </div>

            <div class="mb-2 flex items-center gap-3">
                <h3 class="shrink-0 text-xl font-bold mr-2">Equipos</h3>
                <input type="search" id="teamSearch" placeholder="Buscar equipo..." autocomplete="off" class="w-full min-w-0 rounded-xl border border-slate-300 p-2 text-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" oninput="renderTeamsList()">
            </div>
            <ul id="teamsList" class="flex flex-col gap-2 overflow-y-auto" style="max-height: 256px"></ul>
        </div>
    
        <div class="mb-5 rounded-xl bg-white p-5 shadow-md">
            <h2 class="mb-4 text-2xl font-bold">Vídeo promocional</h2>
            <p id="promoStatus" class="mb-3 text-lg text-slate-600">Sin vídeo</p>
            <input type="file" id="promoFile" accept="video/mp4,video/webm,video/ogg,video/quicktime,.mp4,.webm,.ogg,.mov,.m4v" class="mb-3 w-full min-w-0 rounded-xl border border-slate-300 p-2 text-base">
            <div class="flex justify-center gap-2.5">
                <button type="button" id="btnUploadPromo" onclick="uploadPromo()" class="cursor-pointer rounded-lg bg-green-600 px-4 py-2 text-xl text-white transition-opacity active:opacity-80" aria-label="Subir vídeo" title="Subir vídeo"><i data-lucide="upload" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i></button>
                <button type="button" id="btnDeletePromo" onclick="deletePromo()" class="hidden cursor-pointer rounded-lg bg-red-600 px-4 py-2 text-xl text-white transition-opacity active:opacity-80" aria-label="Eliminar vídeo" title="Eliminar vídeo"><i data-lucide="trash-2" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i></button>
                <button id="btnPromo" type="button" class="hidden cursor-pointer rounded-lg bg-purple-600 px-5 py-4 text-2xl text-white transition-opacity active:opacity-80" onclick="togglePromo()"><i data-lucide="play" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i></button>
                <button id="btnPromoRestart" type="button" class="hidden cursor-pointer rounded-lg bg-slate-600 px-5 py-4 text-2xl text-white transition-opacity active:opacity-80" onclick="restartPromo()" aria-label="Reiniciar vídeo" title="Reiniciar vídeo desde el principio"><i data-lucide="rotate-ccw" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i></button>
            </div>
        </div>

        <div class="mb-5 rounded-xl bg-white p-5 shadow-md">
            <h2 class="text-2xl font-bold">Ajuste manual de tiempo</h2>
            <div class="flex justify-center gap-2.5">
                <input type="number" id="editMin" min="0" max="999" placeholder="Min" class="w-full min-w-0 rounded-xl border border-slate-300 p-2.5 text-2xl focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 md:flex-1">
                <span class="my-2 font-mono text-2xl font-bold">:</span>
                <input type="number" id="editSec" min="0" max="59" placeholder="Seg" class="w-full min-w-0 rounded-xl border border-slate-300 p-2.5 text-2xl focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 md:flex-1">
                <button class="cursor-pointer rounded-lg bg-green-600 p-2.5 text-2xl text-white transition-opacity active:opacity-80" onclick="applyManualTime()">Aplicar</button>
            </div>
        </div>
      </div>
      
      <div class="mb-5 rounded-xl bg-white p-5 shadow-md">
          <h2 class="text-2xl font-bold">Reloj del Partido</h2>
          <div id="tableWatch" class="my-2 font-mono text-6xl font-bold">00:00</div>
          <div class="flex justify-center gap-2.5">
              <button id="btnToggleTime" class="cursor-pointer rounded-lg bg-green-600 px-5 py-4 text-2xl text-white transition-opacity active:opacity-80" onclick="socket.emit('timeToggle', null)"><i data-lucide="play" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i> Reloj</button>
              <button class="max-w-2xl cursor-pointer rounded-lg bg-amber-500 px-5 py-4 text-2xl text-white transition-opacity active:opacity-80" onclick="socket.emit('buzzer', { duration: 2000 })"><i data-lucide="bell" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i> Sonar</button>
              
          </div>
      </div>
  
      <div class="mb-5 rounded-xl bg-white p-5 shadow-md">
          <h2 class="text-2xl font-bold" id="lblLocalName">Puntuación LOCAL</h2>
          <div class="mt-5 flex justify-around gap-2.5" id="botonesLocal">
              <!-- Se rellenan dinámicamente con JavaScript -->
          </div>
  
          <h2 class="mt-8 text-2xl font-bold" id="lblVisitorName">Puntuación VISITANTE</h2>
          <div class="mt-5 flex justify-around gap-2.5" id="botonesVisitante">
              <!-- Se rellenan dinámicamente con JavaScript -->
          </div>
      </div>
  
      <button class="max-w-2xl cursor-pointer rounded-lg bg-red-600 px-5 py-4 text-2xl text-white transition-opacity active:opacity-80" onclick="totalReset()">Reiniciar todo</button>
    </main>

    <script>
        const socket = io();

        const swalBase = { buttonsStyling: false, customClass: {
            popup: 'rounded-xl', confirmButton: 'mx-1 cursor-pointer rounded-lg bg-green-600 px-5 py-2 text-xl text-white active:opacity-80',
            cancelButton: 'mx-1 cursor-pointer rounded-lg bg-slate-500 px-5 py-2 text-xl text-white active:opacity-80' } };

        function showAlert(text, icon = 'warning') {
            return Swal.fire({ ...swalBase, text, icon, confirmButtonText: 'Aceptar' });
        }

        async function showConfirm(text, confirmText = 'Aceptar') {
            const res = await Swal.fire({ ...swalBase, text, icon: 'question', showCancelButton: true,
                confirmButtonText: confirmText, cancelButtonText: 'Cancelar', reverseButtons: true });
            return res.isConfirmed;
        }

        // Sustituye el contenido del botón por un icono Lucide seguido de texto
        function setIconText(el, icon, text) {
            el.innerHTML = `<i data-lucide="${icon}" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i> ${text}`;
            lucide.createIcons();
        }
        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

        document.getElementById('btnToggleSettings').addEventListener('click', (e) => {
            const panel = document.getElementById('settingsPanel');
            const hidden = panel.classList.toggle('hidden');
            e.currentTarget.setAttribute('aria-expanded', String(!hidden));
            setIconText(e.currentTarget, hidden ? 'settings' : 'x', 'Conf.');
        });
        let currentSportName = "";

        function formatDisplayTime(totalSeconds) {
            totalSeconds = totalSeconds.seconds !== undefined ? totalSeconds.seconds : totalSeconds;
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Emitir evento genérico de puntos
        // Ignora pulsaciones repetidas del mismo botón en un intervalo muy corto
        const lastPress = {};
        function debounced(key, fn) {
            const now = Date.now();
            if (now - (lastPress[key] || 0) < 250) return;
            lastPress[key] = now;
            fn();
        }

        function addPoints(team, points) {
            debounced(`p${team}${points}`, () => socket.emit('addPoints', { team: team, points: points }));
        }

        function addFouls(team, fouls) {
            debounced(`f${team}${fouls}`, () => socket.emit('addFouls', { team: team, fouls: fouls }));
        }

        // Fútbol sala: goles (2/3) y faltas (1/3) en la misma fila
        function futsalHtml(team, state, goalLabel, goalColor) {
            const count = team === 'local' ? state.localFouls : state.visitorFouls;
            return `
                <div class="flex w-full gap-2.5">
                    <div class="flex w-2/3 flex-col gap-2.5">
                        <button class="w-full cursor-pointer rounded-lg ${goalColor} h-20 px-2.5 text-3xl text-white transition-opacity active:opacity-80" onclick="addPoints('${team}', 1)">+ ${goalLabel}</button>
                        <button class="w-full cursor-pointer rounded-lg bg-slate-500 p-2.5 text-base text-white transition-opacity active:opacity-80" onclick="addPoints('${team}', -1)">-1 GOL</button>
                    </div>
                    <div class="flex w-1/3 flex-col gap-2.5">
                        <button class="w-full cursor-pointer rounded-lg bg-amber-500 h-20 px-2.5 text-base text-white transition-opacity active:opacity-80" onclick="addFouls('${team}', 1)">+ FALTA</button>
                        <button class="w-full cursor-pointer rounded-lg bg-slate-500 p-2.5 text-base text-white transition-opacity active:opacity-80" onclick="addFouls('${team}', -1)">-1 FALTA</button>
                    </div>
                </div>`;
        }

        // Notificar al backend que queremos cambiar de deporte
        async function changeSport() {
            const selector = document.getElementById('configSelector');
            if (await showConfirm("¿Cambiar de deporte? Esto reiniciará el marcador y el tiempo actual.")) {
                socket.emit('loadConfig', { id: selector.value });
            }
        }

        // En cuanto el websocket se conecta realmente, pedimos los datos iniciales
        socket.on('connect', () => {
            socket.emit('requestInit', null);
        });
      
        // Recibir lista de configuraciones desde SQLite
        socket.on('configsList', (configs) => {
            const selector = document.getElementById('configSelector');
            selector.innerHTML = ''; // Limpiar opciones previas
            configs.forEach(config => {
                const option = document.createElement('option');
                option.value = config.id;
                option.text = `${config.name} (${config.default_minutes} min - ${config.timer_mode === 'down' ? 'Cuenta atrás' : 'Normal'})`;
                selector.appendChild(option);
            });
        });
      
        // Actualizar el estado (y adaptar los botones)
        socket.on('updateScoreboard', (match_state) => {
            currentSportName = match_state.sport_name;
          
            const isFutsal = currentSportName.toLowerCase().includes('fútbol sala');
            const scoreText = (name, points, fouls) =>
                `Puntuación ${name} · G: ${points}` + (isFutsal ? ` · F: ${fouls || 0}` : '');
            document.getElementById('lblLocalName').innerText = scoreText(match_state.localName, match_state.localPoints, match_state.localFouls);
            document.getElementById('lblVisitorName').innerText = scoreText(match_state.visitorName, match_state.visitorPoints, match_state.visitorFouls);
            
            lastState = match_state;
            updatePromoUi(match_state);
            syncTeamSelectors();
          
            const btnToggle = document.getElementById('btnToggleTime');
            if (match_state.is_running) {
                // Si el reloj está corriendo, el botón se pone naranja y dice Pausar
                btnToggle.className = 'cursor-pointer rounded-lg bg-amber-500 px-5 py-4 text-2xl text-white transition-opacity active:opacity-80';
                setIconText(btnToggle, 'pause', ' Reloj');
            } else {
                // Si está parado, el botón se pone verde y dice Iniciar
                btnToggle.className = 'cursor-pointer rounded-lg bg-green-600 px-5 py-4 text-2xl text-white transition-opacity active:opacity-80';
                setIconText(btnToggle, 'play', ' Reloj');
            }
            
            // Adaptar interfaz si es Baloncesto u otro deporte
            const localDiv = document.getElementById('botonesLocal');
            const visitorDiv = document.getElementById('botonesVisitante');

            // Forzamos que los botones se apilen en vertical para colocar el de restar debajo
            localDiv.style.flexDirection = 'column';
            visitorDiv.style.flexDirection = 'column';

            if(currentSportName.toLowerCase().includes('baloncesto')) {
                localDiv.innerHTML = `
                    <div class="flex w-full gap-2.5">
                        <button class="flex-1 cursor-pointer rounded-lg bg-green-600 p-5 text-3xl text-white transition-opacity active:opacity-80" onclick="addPoints('local', 1)">+1</button>
                        <button class="flex-1 cursor-pointer rounded-lg bg-green-600 p-5 text-3xl text-white transition-opacity active:opacity-80" onclick="addPoints('local', 2)">+2</button>
                        <button class="flex-1 cursor-pointer rounded-lg bg-green-600 p-5 text-3xl text-white transition-opacity active:opacity-80" onclick="addPoints('local', 3)">+3</button>
                    </div>
                    <button class="mt-2.5 w-full cursor-pointer rounded-lg bg-slate-500 md:w-1/3 md:self-center p-2.5 text-base text-white transition-opacity active:opacity-80" onclick="addPoints('local', -1)">-1 Punto (Corregir)</button>
                `;
                visitorDiv.innerHTML = `
                    <div class="flex w-full gap-2.5">
                        <button class="flex-1 cursor-pointer rounded-lg bg-blue-600 p-5 text-3xl text-white transition-opacity active:opacity-80" onclick="addPoints('visitor', 1)">+1</button>
                        <button class="flex-1 cursor-pointer rounded-lg bg-blue-600 p-5 text-3xl text-white transition-opacity active:opacity-80" onclick="addPoints('visitor', 2)">+2</button>
                        <button class="flex-1 cursor-pointer rounded-lg bg-blue-600 p-5 text-3xl text-white transition-opacity active:opacity-80" onclick="addPoints('visitor', 3)">+3</button>
                    </div>
                    <button class="mt-2.5 w-full cursor-pointer rounded-lg bg-slate-500 md:w-1/3 md:self-center p-2.5 text-base text-white transition-opacity active:opacity-80" onclick="addPoints('visitor', -1)">-1 Punto (Corregir)</button>
                `;
            } else { // Interfaz por defecto para fútbol / fútbol sala
                localDiv.innerHTML = `
                  <button class="w-full md:w-1/3 md:self-center cursor-pointer rounded-lg bg-green-600 p-5 text-3xl text-white transition-opacity active:opacity-80" onclick="addPoints('local', 1)">+ GOL LOCAL</button>
                  <button class="mt-2.5 w-full cursor-pointer rounded-lg bg-slate-500 md:w-1/3 md:self-center p-2.5 text-base text-white transition-opacity active:opacity-80" onclick="addPoints('local', -1)">-1 GOL (Corregir)</button>
                `;
                visitorDiv.innerHTML = `
                  <button class="w-full md:w-1/3 md:self-center cursor-pointer rounded-lg bg-blue-600 p-5 text-3xl text-white transition-opacity active:opacity-80" onclick="addPoints('visitor', 1)">+ GOL VISITANTE</button>
                  <button class="mt-2.5 w-full cursor-pointer rounded-lg bg-slate-500 md:w-1/3 md:self-center p-2.5 text-base text-white transition-opacity active:opacity-80" onclick="addPoints('visitor', -1)">-1 GOL (Corregir)</button>
                `;
            }

            if(currentSportName.toLowerCase().includes('fútbol sala')) {
                localDiv.innerHTML = futsalHtml('local', match_state, 'GOL', 'bg-green-600');
                visitorDiv.innerHTML = futsalHtml('visitor', match_state, 'GOL', 'bg-blue-600');
            }

            // Seleccionar en el dropdown el deporte actual si nos acabamos de conectar
            const selector = document.getElementById('configSelector');
            for(let i = 0; i < selector.options.length; i++) {
                if(selector.options[i].text.includes(currentSportName)) {
                    selector.selectedIndex = i;
                    break;
                }
            }
        });

        socket.on('updateTime', (seconds) => {
            document.getElementById('tableWatch').innerText = formatDisplayTime(seconds);
        });

        async function totalReset() {
            if (await showConfirm("¿Seguro que quieres reiniciar TODO a 0?", "Reiniciar")) {
                socket.emit('totalReset', null);
            }
        }
      
        // Función para aplicar el tiempo manual
        async function applyManualTime() {
            // Leer los valores de los inputs (si están vacíos, usamos 0)
            const min = parseInt(document.getElementById('editMin').value) || 0;
            const sec = parseInt(document.getElementById('editSec').value) || 0;
            
            // Calcular los segundos totales
            const totalSeconds = (min * 60) + sec;
            
            // Confirmar la acción para evitar errores en directo
            const textTime = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
            if (await showConfirm(`¿Estás seguro de ajustar el reloj a ${textTime}?`)) {
                socket.emit('setTime', { seconds: totalSeconds });
                
                // Vaciar los campos después de aplicarlo
                document.getElementById('editMin').value = '';
                document.getElementById('editSec').value = '';
            }
        }
      
        function showLogo(suffix, url) {
            const img = document.getElementById(`preview${suffix}Logo`);
            if (url) {
                img.src = url;
            } else {
                img.removeAttribute('src');
            }
            img.classList.toggle('hidden', !url);
        }

        let teams = [];
        let lastState = null;
        let editingTeamId = null;

        const comboSelected = { local: null, visitor: null };
        const comboDefaults = { local: 'LOCAL', visitor: 'VISITANTE' };

        function comboIds(side) {
            const S = side === 'local' ? 'Local' : 'Visitor';
            return { input: `combo${S}Input`, list: `combo${S}List` };
        }

        function comboLabel(side) {
            const t = teams.find(x => x.id === comboSelected[side]);
            return t ? t.name : comboDefaults[side];
        }

        function comboOpen(side) {
            const input = document.getElementById(comboIds(side).input);
            input.select();
            comboRender(side, true);
        }

        function comboRender(side, showAll) {
            const ids = comboIds(side);
            const list = document.getElementById(ids.list);
            const q = showAll ? '' : document.getElementById(ids.input).value.trim().toLowerCase();
            list.innerHTML = '';
            const options = [{ id: null, name: comboDefaults[side] }].concat(teams).filter(t => t.id === null || t.name.toLowerCase().includes(q));
            options.forEach(t => {
                const li = document.createElement('li');
                li.className = 'cursor-pointer px-3 py-2 text-xl active:bg-slate-200' + (t.id === comboSelected[side] ? ' bg-blue-100 font-bold' : '');
                li.textContent = t.name;
                li.onclick = () => {
                    selectTeam(side, t.id === null ? '' : t.id);
                    comboSelected[side] = t.id;
                    document.getElementById(ids.input).value = t.name;
                    document.getElementById(ids.input).blur();
                };
                list.appendChild(li);
            });
            if (!options.length) {
                const li = document.createElement('li');
                li.className = 'px-3 py-2 text-lg text-slate-500';
                li.textContent = 'Sin resultados';
                list.appendChild(li);
            }
            list.classList.remove('hidden');
        }

        function comboClose(side) {
            const ids = comboIds(side);
            document.getElementById(ids.list).classList.add('hidden');
            document.getElementById(ids.input).value = comboLabel(side);
        }

        function syncTeamSelectors() {
            if (!lastState) return;
            comboSelected.local = lastState.localTeamId ?? null;
            comboSelected.visitor = lastState.visitorTeamId ?? null;
            ['local', 'visitor'].forEach(side => {
                const input = document.getElementById(comboIds(side).input);
                if (document.activeElement !== input) input.value = comboLabel(side);
            });
            showLogo('Local', lastState.localLogo);
            showLogo('Visitor', lastState.visitorLogo);
        }

        socket.on('teamsList', (list) => {
            teams = list;
            syncTeamSelectors();
            renderTeamsList();
        });

        function renderTeamsList() {
            const ul = document.getElementById('teamsList');
            ul.innerHTML = '';
            const q = document.getElementById('teamSearch').value.trim().toLowerCase();
            teams.filter(t => t.name.toLowerCase().includes(q)).forEach(t => {
                const li = document.createElement('li');
                li.className = 'flex items-center gap-2 rounded-xl border border-slate-300 p-2';
                const img = document.createElement('img');
                img.className = 'h-10 w-10 shrink-0 object-contain' + (t.logo ? '' : ' invisible');
                if (t.logo) img.src = t.logo;
                const name = document.createElement('span');
                name.className = 'min-w-0 flex-1 truncate text-left text-l';
                name.textContent = t.name;
                const edit = document.createElement('button');
                edit.type = 'button';
                edit.className = 'cursor-pointer rounded-lg bg-blue-600 px-3 py-1.5 text-base text-white active:opacity-80';
                edit.textContent = 'Editar';
                edit.onclick = () => editTeam(t.id);
                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'cursor-pointer rounded-lg bg-red-600 px-3 py-1.5 text-base text-white active:opacity-80';
                del.innerHTML = '<i data-lucide="trash-2" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i>';
                del.setAttribute('aria-label', 'Eliminar equipo');
                del.title = 'Eliminar equipo';
                del.onclick = () => deleteTeam(t.id);
                li.append(img, name, edit, del);
                ul.appendChild(li);
            });
            lucide.createIcons();
        }

        function selectTeam(side, id) {
            socket.emit('selectTeam', { side: side, id: id === '' ? null : Number(id) });
        }

        function editTeam(id) {
            const t = teams.find(x => x.id === id);
            if (!t) return;
            editingTeamId = id;
            document.getElementById('teamName').value = t.name;
            document.getElementById('teamFile').value = '';
            document.getElementById('teamRemoveLogo').checked = false;
            const img = document.getElementById('teamFormLogo');
            if (t.logo) img.src = t.logo; else img.removeAttribute('src');
            img.classList.toggle('hidden', !t.logo);
            document.getElementById('teamRemoveLogoRow').classList.toggle('hidden', !t.logo);
            document.getElementById('teamRemoveLogoRow').classList.toggle('flex', !!t.logo);
            document.getElementById('teamFormTitle').textContent = 'Editar equipo';
            document.getElementById('btnCancelTeam').classList.remove('hidden');
            document.getElementById('teamName').focus();
        }

        function resetTeamForm() {
            editingTeamId = null;
            document.getElementById('teamName').value = '';
            document.getElementById('teamFile').value = '';
            document.getElementById('teamRemoveLogo').checked = false;
            document.getElementById('teamFormLogo').classList.add('hidden');
            document.getElementById('teamRemoveLogoRow').classList.add('hidden');
            document.getElementById('teamRemoveLogoRow').classList.remove('flex');
            document.getElementById('teamFormTitle').textContent = 'Añadir equipo';
            document.getElementById('btnCancelTeam').classList.add('hidden');
        }

        async function saveTeam() {
            const name = document.getElementById('teamName').value.trim();
            if (!name) {
                showAlert('Introduce el nombre del equipo');
                return;
            }
            const body = new FormData();
            if (editingTeamId !== null) body.append('id', editingTeamId);
            body.append('name', name);
            body.append('remove_logo', document.getElementById('teamRemoveLogo').checked ? 'true' : 'false');
            const file = document.getElementById('teamFile').files[0];
            if (file) body.append('file', file);
            try {
                const res = await fetch('/save_team', { method: 'POST', body });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    showAlert(err.error || 'No se pudo guardar el equipo', 'error');
                    return;
                }
                resetTeamForm();
            } catch (e) {
                showAlert('No se pudo guardar el equipo', 'error');
            }
        }

        function updatePromoUi(state) {
            const has = !!state.promoUrl;
            const btn = document.getElementById('btnPromo');
            btn.classList.toggle('hidden', !has);
            document.getElementById('btnPromoRestart').classList.toggle('hidden', !has);
            btn.innerHTML = `<i data-lucide="${state.promoPlaying ? 'square' : 'play'}" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i><i data-lucide="film" class="inline-block h-[1.1em] w-[1.1em] align-[-0.15em]"></i>`;
            lucide.createIcons();
            btn.classList.toggle('bg-purple-600', !state.promoPlaying);
            btn.classList.toggle('bg-red-600', !!state.promoPlaying);
            document.getElementById('promoStatus').textContent = has ? 'Vídeo cargado' : 'Sin vídeo';
            document.getElementById('btnDeletePromo').classList.toggle('hidden', !has);
        }

        function restartPromo() {
            socket.emit('restartPromo', null);
        }

        function togglePromo() {
            socket.emit('setPromoPlaying', { playing: !(lastState && lastState.promoPlaying) });
        }

        function uploadPromo() {
            const file = document.getElementById('promoFile').files[0];
            if (!file) {
                showAlert('Selecciona un vídeo');
                return;
            }
            const btn = document.getElementById('btnUploadPromo');
            const status = document.getElementById('promoStatus');
            const body = new FormData();
            body.append('file', file);
            btn.disabled = true;
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload_promo');
            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) status.textContent = `Subiendo... ${Math.round(e.loaded / e.total * 100)}%`;
            };
            xhr.onload = () => {
                btn.disabled = false;
                if (xhr.status >= 200 && xhr.status < 300) {
                    document.getElementById('promoFile').value = '';
                } else {
                    let msg = 'No se pudo subir el vídeo';
                    try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
                    showAlert(msg, 'error');
                }
                if (lastState) updatePromoUi(lastState);
            };
            xhr.onerror = () => {
                btn.disabled = false;
                showAlert('No se pudo subir el vídeo', 'error');
                if (lastState) updatePromoUi(lastState);
            };
            xhr.send(body);
        }

        async function deletePromo() {
            if (!(await showConfirm('¿Eliminar el vídeo promocional?', 'Eliminar'))) return;
            await fetch('/delete_promo', { method: 'POST' });
        }

        async function deleteTeam(id) {
            const t = teams.find(x => x.id === id);
            if (!(await showConfirm(`¿Eliminar el equipo "${t ? t.name : ''}"?`, 'Eliminar'))) return;
            await fetch(`/delete_team?id=${id}`, { method: 'POST' });
            if (editingTeamId === id) resetTeamForm();
        }

        // Pantalla siempre activa
        var noSleep = new NoSleep();
        var noSleepSwitch = document.getElementById('noSleepSwitch');

        function setNoSleep(on) {
            if (on) {
                noSleep.enable();
            } else {
                noSleep.disable();
            }
            noSleepSwitch.checked = on;
        }

        noSleepSwitch.addEventListener('change', function () {
            setNoSleep(noSleepSwitch.checked);
        });

        // El navegador exige un gesto del usuario: se activa en el primer clic fuera del switch
        document.addEventListener('click', function enableNoSleep(e) {
            if (e.target.closest('#noSleepToggle')) {
                document.removeEventListener('click', enableNoSleep, false);
                return;
            }
            document.removeEventListener('click', enableNoSleep, false);
            setNoSleep(true);
        }, false);
    </script>
</body>
</html>
